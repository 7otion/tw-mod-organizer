[package]
name = "tw-mod-organizer"
version = "0.1.0"
publish = false
description = "TW Mod Organizer"
authors = ["Burak Kartal"]
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-7otion-sqlite = { path = "../../7otion-tauri/orm/backend" }

fs4 = "1.1.0"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5.2.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
