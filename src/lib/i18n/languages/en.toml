description = "TMO talks to Steam through s7forge, a small helper that starts only when it's needed, so Steam never thinks your game is running. It's downloaded once from GitHub and kept up to date."
downloading = "Downloading… {received} of {total} MB"
finding = "Finding the latest version…"
download = "Download s7forge"

# Keyboard shortcuts. Write the Ctrl key the way keyboards in your language label it
# (for example "Strg" in German). {key} is the other key.
[shortcuts]
ctrl = "Ctrl {key}"
ctrlPlus = "Ctrl+{key}"

